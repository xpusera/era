name: lua_api_deploy

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/gltf-anim-upgrade

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Install mkdocs
        run: |
          pip install -U -r doc/mkdocs/requirements.txt

      - name: Build documentation
        run: |
          cd doc/mkdocs/
          ./build.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-public
          path: 'public/'

      - name: Detect Pages enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages not enabled for this repo (HTTP $code); skipping deploy."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public/'
        if: steps.pages.outputs.enabled == 'true'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: steps.pages.outputs.enabled == 'true'
